<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" width="100%" height="60">
  <defs>
    <!-- Wind animation hint & shadows -->
    <filter id="flagShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Suspension rope spanning across -->
  <path d="M 0,20 Q 150,45 300,28 Q 450,50 600,25 Q 750,52 900,28 Q 1050,48 1200,22" fill="none" stroke="#e0caa0" stroke-width="3" stroke-linecap="round"/>

  <!-- Flag 1: Blue (Space / Sky) -->
  <polygon points="40,25 90,32 82,90 32,78" fill="#1e5ba8" filter="url(#flagShadow)"/>
  <!-- Tibetan script motif hint -->
  <line x1="45" y1="45" x2="75" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <line x1="43" y1="58" x2="73" y2="62" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- Flag 2: White (Air / Wind) -->
  <polygon points="120,35 170,39 162,98 112,88" fill="#f8fafc" filter="url(#flagShadow)"/>
  <line x1="125" y1="55" x2="155" y2="58" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="123" y1="68" x2="153" y2="72" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Flag 3: Red (Fire) -->
  <polygon points="200,38 250,35 242,96 192,94" fill="#d9383a" filter="url(#flagShadow)"/>
  <line x1="205" y1="56" x2="235" y2="54" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <line x1="203" y1="69" x2="233" y2="68" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- Flag 4: Green (Water) -->
  <polygon points="280,28 330,32 324,88 274,80" fill="#2d8a4e" filter="url(#flagShadow)"/>
  <line x1="285" y1="46" x2="315" y2="50" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <line x1="283" y1="60" x2="313" y2="64" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- Flag 5: Yellow (Earth) -->
  <polygon points="360,37 410,43 402,102 352,91" fill="#f59e0b" filter="url(#flagShadow)"/>
  <line x1="365" y1="57" x2="395" y2="62" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <line x1="363" y1="71" x2="393" y2="76" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- Repeating cycle 2 -->
  <!-- Blue -->
  <polygon points="440,47 490,44 482,106 432,102" fill="#1e5ba8" filter="url(#flagShadow)"/>
  <line x1="445" y1="65" x2="475" y2="63" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- White -->
  <polygon points="520,38 570,30 562,91 512,94" fill="#f8fafc" filter="url(#flagShadow)"/>
  <line x1="525" y1="56" x2="555" y2="50" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Red -->
  <polygon points="600,26 650,33 642,88 592,78" fill="#d9383a" filter="url(#flagShadow)"/>
  <line x1="605" y1="46" x2="635" y2="51" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- Green -->
  <polygon points="680,41 730,48 722,106 672,96" fill="#2d8a4e" filter="url(#flagShadow)"/>
  <line x1="685" y1="61" x2="715" y2="67" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- Yellow -->
  <polygon points="760,50 810,44 804,105 754,106" fill="#f59e0b" filter="url(#flagShadow)"/>
  <line x1="765" y1="69" x2="795" y2="65" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>

  <!-- Repeating cycle 3 -->
  <!-- Blue -->
  <polygon points="840,36 890,29 882,91 832,92" fill="#1e5ba8" filter="url(#flagShadow)"/>
  <line x1="845" y1="54" x2="875" y2="48" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- White -->
  <polygon points="920,29 970,36 962,94 912,84" fill="#f8fafc" filter="url(#flagShadow)"/>
  <line x1="925" y1="49" x2="955" y2="54" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Red -->
  <polygon points="1000,43 1050,46 1042,104 992,98" fill="#d9383a" filter="url(#flagShadow)"/>
  <line x1="1005" y1="63" x2="1035" y2="65" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- Green -->
  <polygon points="1080,45 1130,35 1124,96 1074,101" fill="#2d8a4e" filter="url(#flagShadow)"/>
  <line x1="1085" y1="64" x2="1115" y2="55" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.8"/>
  <!-- Yellow -->
  <polygon points="1150,30 1195,24 1190,82 1145,86" fill="#f59e0b" filter="url(#flagShadow)"/>
</svg>
