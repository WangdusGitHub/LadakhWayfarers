<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient: Deep twilight to warm high-altitude horizon -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="40%" stop-color="#142850" />
      <stop offset="70%" stop-color="#2c3e6b" />
      <stop offset="100%" stop-color="#f8a555" />
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="1" />
      <stop offset="30%" stop-color="#ffd166" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f78c42" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f78c42" stop-opacity="0" />
    </radialGradient>

    <!-- Mountain gradients -->
    <linearGradient id="farPeakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#3b4a6b" />
    </linearGradient>

    <linearGradient id="midMountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a4d41" />
      <stop offset="60%" stop-color="#332a24" />
      <stop offset="100%" stop-color="#1d1612" />
    </linearGradient>

    <linearGradient id="nearMountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c221c" />
      <stop offset="100%" stop-color="#0e0a08" />
    </linearGradient>

    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="40%" stop-color="#00b4d8" />
      <stop offset="75%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Sky background -->
  <rect width="1440" height="600" fill="url(#skyGrad)" />

  <!-- Morning Sun rising over peaks -->
  <circle cx="820" cy="220" r="140" fill="url(#sunGlow)" />
  <circle cx="820" cy="220" r="42" fill="#fffef8" filter="url(#softGlow)" />

  <!-- Stars in upper deep sky -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="40" r="1.5" />
    <circle cx="280" cy="70" r="1" />
    <circle cx="450" cy="30" r="2" />
    <circle cx="620" cy="65" r="1" />
    <circle cx="1100" cy="50" r="1.8" />
    <circle cx="1320" cy="80" r="1.2" />
    <circle cx="980" cy="35" r="1.5" />
  </g>

  <!-- Distant Snow Covered Peaks (Great Himalayan / Karakoram Range) -->
  <polygon points="0,380 90,270 180,310 320,180 430,290 560,190 710,320 860,160 1020,280 1180,170 1340,290 1440,220 1440,600 0,600" fill="url(#farPeakGrad)" opacity="0.9" />

  <!-- Snow Caps Highlights on Distant Peaks -->
  <polygon points="320,180 280,230 310,240 330,225 360,240 350,210" fill="#ffffff" opacity="0.95" />
  <polygon points="560,190 520,235 550,245 570,235 595,245 585,215" fill="#ffffff" opacity="0.95" />
  <polygon points="860,160 810,220 845,230 870,215 905,235 890,195" fill="#ffffff" opacity="0.95" />
  <polygon points="1180,170 1140,220 1165,225 1190,215 1215,230 1205,195" fill="#ffffff" opacity="0.95" />

  <!-- Mid-ground Dramatic Rugged Ladakh Cold Desert Mountains -->
  <polygon points="0,440 140,320 300,410 460,300 620,400 780,310 950,420 1120,310 1290,390 1440,330 1440,600 0,600" fill="url(#midMountainGrad)" />

  <!-- Pristine Turquoise Lake (Pangong Tso / Tso Moriri representation) -->
  <path d="M 120,450 C 350,430 650,470 950,445 C 1150,430 1350,460 1440,470 L 1440,540 C 1200,560 800,530 400,555 C 200,568 0,550 0,550 L 0,465 Z" fill="url(#lakeGrad)" opacity="0.85" />
  <!-- Lake water ripples & reflections -->
  <path d="M 400,470 C 600,460 800,480 1000,465" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 550,490 C 720,485 920,495 1100,485" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.3" />

  <!-- Foreground Winding Mountain Pass Ridge & Road (Khardung La / Chang La Pass) -->
  <polygon points="0,480 200,430 450,490 700,440 920,510 1200,470 1440,520 1440,600 0,600" fill="url(#nearMountainGrad)" />

  <!-- Winding Asphalt Highway Ribbon -->
  <path d="M 0,590 Q 250,560 450,540 T 800,520 T 1150,510 T 1440,530" fill="none" stroke="#2b2d42" stroke-width="18" stroke-linecap="round"/>
  <path d="M 0,590 Q 250,560 450,540 T 800,520 T 1150,510 T 1440,530" fill="none" stroke="#f1faee" stroke-width="2" stroke-dasharray="20,25"/>

  <!-- Iconic Ladakhi Buddhist Chorten / Stupa (Left cliff foreground) -->
  <g transform="translate(140, 360)">
    <!-- Base square tiers -->
    <rect x="-35" y="65" width="70" height="15" fill="#f8fafc" rx="1"/>
    <rect x="-30" y="52" width="60" height="14" fill="#e2e8f0" rx="1"/>
    <rect x="-24" y="40" width="48" height="13" fill="#ffffff" rx="1"/>
    <!-- Dome (Bumpa) -->
    <ellipse cx="0" cy="22" rx="20" ry="18" fill="#f8fafc"/>
    <rect x="-18" y="2" width="36" height="5" fill="#d97706"/>
    <!-- Spire (13 stepped rings) -->
    <polygon points="-12,2 12,2 4,-32 -4,-32" fill="#d97706"/>
    <!-- Crescent Moon & Sun finial (Sogshing) -->
    <circle cx="0" cy="-38" r="6" fill="#fbbf24"/>
    <circle cx="2" cy="-39" r="4.5" fill="#0b1325"/>
    <circle cx="0" cy="-44" r="3" fill="#fbbf24"/>
  </g>

  <!-- High-Altitude Pass Signpost (Right cliffside) -->
  <g transform="translate(1260, 410)">
    <!-- Posts -->
    <line x1="-30" y1="50" x2="-30" y2="100" stroke="#475569" stroke-width="5"/>
    <line x1="30" y1="50" x2="30" y2="100" stroke="#475569" stroke-width="5"/>
    <!-- Board -->
    <rect x="-55" y="10" width="110" height="55" fill="#facc15" stroke="#1e293b" stroke-width="3" rx="4"/>
    <text x="0" y="28" font-family="sans-serif" font-weight="900" font-size="9" fill="#0f172a" text-anchor="middle">LADAKH TAXI</text>
    <text x="0" y="42" font-family="sans-serif" font-weight="bold" font-size="11" fill="#dc2626" text-anchor="middle">19,024 FT</text>
    <text x="0" y="55" font-family="sans-serif" font-weight="700" font-size="7.5" fill="#0f172a" text-anchor="middle">UMLING LA READY</text>
  </g>
</svg>
